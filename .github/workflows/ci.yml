name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rivalscope
          POSTGRES_PASSWORD: rivalscope_local
          POSTGRES_DB: rivalscope_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rivalscope"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6380:6379"]
    env:
      DATABASE_URL: postgresql://rivalscope:rivalscope_local@localhost:5433/rivalscope_test
      REDIS_URL: redis://localhost:6380/1
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SMTP_URL: smtp://localhost:1025
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
        working-directory: rivalscope-backend
      - run: npm ci
        working-directory: rivalscope-frontend
      - run: npm run db:generate
        working-directory: rivalscope-backend
      - run: npm run db:migrate
        working-directory: rivalscope-backend
      - run: npm run db:seed
        working-directory: rivalscope-backend
      - run: npm run check
