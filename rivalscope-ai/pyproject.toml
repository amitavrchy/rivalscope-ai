[project]
name = "rivalscope-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "pgvector>=0.5.1",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "tavily-python>=0.8.5",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
